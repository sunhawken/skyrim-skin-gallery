<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Female Skin Comparisons</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surf: #141414;
    --surf2: #1c1c1c;
    --bord: #282828;
    --accent: #c8a96e;
    --accent2: #5c3410;
    --text: #e4dccb;
    --dim: #5a5a5a;
    --c1: #1e5c1e;
    --c1b: #3daa3d;
    --c1hl: rgba(30,92,30,0.25);
    --c2: #1e1e7a;
    --c2b: #5555ee;
    --c2hl: rgba(30,30,122,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', sans-serif;
  }

  /* ══ CONTROLS ══════════════════════════════════════ */
  .controls {
    flex-shrink: 0;
    background: linear-gradient(180deg, #0e0b04 0%, #181006 100%);
    border-bottom: 2px solid var(--accent2);
    padding: 7px 14px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .cg { display: flex; gap: 3px; align-items: center; }
  .sep { width: 1px; height: 18px; background: var(--bord); margin: 0 2px; }
  .cl { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; white-space: nowrap; }
  button {
    background: var(--surf2); border: 1px solid var(--bord);
    color: var(--text); padding: 3px 8px; border-radius: 3px;
    cursor: pointer; font-size: 0.72rem; line-height: 1.5; transition: all .1s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent2); border-color: var(--accent); color: var(--accent); }
  button.fav-on { background: #3a2800; border-color: #c8a000; color: #ffc800; }
  button.sync-on { background: #002233; border-color: #0088cc; color: #44ccff; }
  input[type=search] {
    background: var(--surf2); border: 1px solid var(--bord);
    color: var(--text); padding: 3px 7px; border-radius: 3px;
    font-size: 0.72rem; outline: none; width: 140px;
  }
  input[type=search]:focus { border-color: var(--accent); }
  .count { font-size: 0.67rem; color: var(--dim); margin-left: auto; }

  /* ══ COMPARE AREA ══════════════════════════════════ */
  .cmp-area {
    flex-shrink: 0;
    position: relative;
    display: flex;
    height: 72vh;
    min-height: 200px;
    border-bottom: 2px solid var(--bord);
    overflow: hidden;
  }

  /* Side-by-side panels */
  .cmp-panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    position: relative; background: #060606;
    transition: clip-path 0s;
  }
  .cmp-panel.p2 { border-left: 2px solid var(--bord); }
  .cmp-panel.p1 { border-top: 3px solid var(--c1b); }
  .cmp-panel.p2 { border-top: 3px solid var(--c2b); }

  /* Slider mode overrides */
  .cmp-area.slider .cmp-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: none; }
  .cmp-area.slider .cmp-panel.p1 { border-top: none; z-index: 1; }
  .cmp-area.slider .cmp-panel.p2 { border-top: none; z-index: 2; border-left: none; }

  /* Panel top bar */
  .panel-top {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: linear-gradient(180deg, rgba(0,0,0,.85) 0%, transparent 100%);
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  }
  .pnum {
    width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 0.65rem; color: #fff;
  }
  .p1 .pnum { background: var(--c1b); }
  .p2 .pnum { background: var(--c2b); }
  .pname { font-size: 0.72rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }

  /* Race tabs inside panel */
  .race-tabs {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; gap: 2px; padding: 4px 6px;
    background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, transparent 100%);
    overflow-x: auto; overflow-y: hidden;
  }
  .race-tabs::-webkit-scrollbar { height: 3px; }
  .race-tabs::-webkit-scrollbar-thumb { background: var(--bord); }
  .race-tab {
    flex-shrink: 0;
    background: rgba(20,20,20,.8); border: 1px solid rgba(80,80,80,.5);
    color: var(--dim); padding: 2px 6px; border-radius: 2px;
    cursor: pointer; font-size: 0.6rem; backdrop-filter: blur(3px);
    transition: all .1s;
  }
  .p1 .race-tab:hover { border-color: var(--c1b); color: var(--c1b); }
  .p2 .race-tab:hover { border-color: var(--c2b); color: var(--c2b); }
  .p1 .race-tab.on { background: var(--c1); border-color: var(--c1b); color: #9f9; }
  .p2 .race-tab.on { background: var(--c2); border-color: var(--c2b); color: #99f; }

  /* Panel images */
  .panel-imgs {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    cursor: zoom-in;
  }
  .panel-imgs img {
    flex: 1; width: 100%;
    object-fit: contain; object-position: top center;
    display: block; min-height: 0;
  }
  .panel-imgs.stacked img { flex: 1; border-bottom: 1px solid var(--bord); }
  .panel-imgs.stacked img:last-child { border-bottom: none; }
  .panel-ph {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; color: var(--dim); font-size: 0.75rem;
  }
  .panel-ph .arr { font-size: 1.6rem; opacity: .3; }

  /* Slider handle */
  .slider-handle {
    display: none;
    position: absolute; top: 0; bottom: 0;
    width: 4px; background: #fff; cursor: ew-resize; z-index: 10;
    transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(0,0,0,.8);
  }
  .slider-handle::before {
    content: '◄►';
    position: absolute; top: 50%; transform: translateY(-50%);
    left: 50%; margin-left: -18px;
    width: 36px; height: 24px;
    background: rgba(255,255,255,.15); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,.3); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: #fff; letter-spacing: 2px; line-height: 24px; text-align: center;
  }
  .cmp-area.slider .slider-handle { display: block; }

  /* Slider label pills */
  .slider-label-1, .slider-label-2 {
    position: absolute; bottom: 32px; z-index: 8;
    background: rgba(0,0,0,.7); border-radius: 3px;
    padding: 2px 7px; font-size: 0.68rem; color: var(--text);
    pointer-events: none; white-space: nowrap; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .slider-label-1 { left: 8px; border-left: 3px solid var(--c1b); }
  .slider-label-2 { right: 8px; border-right: 3px solid var(--c2b); }

  /* ══ STRIPS ════════════════════════════════════════ */
  .strips-area {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  .strip-row {
    flex: 1; min-height: 0;
    display: flex; align-items: stretch;
  }
  .strip-row + .strip-row { border-top: 1px solid var(--bord); }
  .strip-row.kbd-active { background: rgba(255,255,255,.02); }

  .strip-gutter {
    flex-shrink: 0; width: 32px;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; text-orientation: mixed;
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: .1em;
    background: var(--surf);
  }
  .r1 .strip-gutter { border-right: 2px solid var(--c1b); color: var(--c1b); }
  .r2 .strip-gutter { border-right: 2px solid var(--c2b); color: var(--c2b); }
  .r1.kbd-active .strip-gutter { background: var(--c1hl); }
  .r2.kbd-active .strip-gutter { background: var(--c2hl); }

  .strip {
    flex: 1; min-width: 0;
    overflow-x: auto; overflow-y: hidden;
    display: flex; align-items: stretch;
    padding: 5px; gap: 5px;
    background: var(--surf);
    scroll-behavior: smooth;
  }
  .strip::-webkit-scrollbar { height: 6px; }
  .strip::-webkit-scrollbar-track { background: var(--surf2); }
  .r1 .strip::-webkit-scrollbar-thumb { background: var(--c1); border-radius: 3px; }
  .r2 .strip::-webkit-scrollbar-thumb { background: var(--c2); border-radius: 3px; }

  /* Thumbnails */
  .thumb {
    flex-shrink: 0; width: 82px;
    display: flex; flex-direction: column;
    border: 2px solid var(--bord); border-radius: 3px;
    overflow: hidden; cursor: pointer; position: relative;
    background: #0e0e0e;
    transition: border-color .1s, transform .1s;
  }
  .thumb:hover { border-color: var(--accent); transform: scaleY(1.04); }
  .r1 .thumb.sel { border-color: var(--c1b); box-shadow: 0 0 0 2px var(--c1); background: var(--c1hl); }
  .r2 .thumb.sel { border-color: var(--c2b); box-shadow: 0 0 0 2px var(--c2); background: var(--c2hl); }
  .r1 .thumb.kbd-cur { outline: 2px dashed var(--c1b); outline-offset: 2px; }
  .r2 .thumb.kbd-cur { outline: 2px dashed var(--c2b); outline-offset: 2px; }
  .thumb.hidden { display: none; }
  .thumb img {
    width: 100%; aspect-ratio: 3/4;
    object-fit: cover; object-position: top center;
    display: block;
  }
  .thumb .noimg {
    width: 100%; aspect-ratio: 3/4;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: var(--dim);
  }
  .thumb-bot {
    padding: 2px 4px 2px 4px;
    font-size: 0.56rem; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--surf2);
    display: flex; align-items: center; justify-content: space-between; gap: 2px;
  }
  .star-btn {
    background: none; border: none; padding: 0; cursor: pointer;
    font-size: 0.75rem; line-height: 1; color: var(--dim); flex-shrink: 0;
    transition: color .1s;
  }
  .star-btn:hover { color: #ffc800; }
  .star-btn.on { color: #ffc800; }

  /* ══ LIGHTBOX ═════════════════════════════════════ */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.92); backdrop-filter: blur(6px);
    align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.on { display: flex; }
  .lightbox img {
    max-width: 96vw; max-height: 96vh;
    object-fit: contain;
    border: 1px solid var(--bord); border-radius: 3px;
    box-shadow: 0 0 60px rgba(0,0,0,.8);
    cursor: default;
    transform-origin: center center;
    transition: transform .15s;
  }
  .lb-close {
    position: fixed; top: 14px; right: 18px;
    background: rgba(0,0,0,.6); border: 1px solid var(--bord);
    color: var(--text); padding: 4px 10px; border-radius: 3px;
    cursor: pointer; font-size: 1rem; z-index: 101;
  }
  .lb-close:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<!-- Controls -->
<div class="controls">
  <div class="cg">
    <span class="cl">Type</span>
    <button class="on" data-type="BODY">Body</button>
    <button data-type="HEAD">Head</button>
    <button data-type="BOTH">Both</button>
  </div>
  <div class="sep"></div>
  <div class="cg">
    <span class="cl">Mode</span>
    <button class="on" id="btn-side" onclick="setMode('side')">Side by side</button>
    <button id="btn-slider" onclick="setMode('slider')">&#9664;&#9654; Slider</button>
  </div>
  <div class="sep"></div>
  <div class="cg">
    <button id="btn-sync" onclick="toggleSync()">&#8644; Sync strips</button>
    <button id="btn-fav" onclick="toggleFavFilter()">&#9733; Starred only</button>
    <button onclick="randomPick()">&#9674; Random</button>
  </div>
  <div class="sep"></div>
  <input type="search" placeholder="Filter mods…" oninput="onSearch(this.value)">
  <span class="count" id="count"></span>
</div>

<!-- Compare area -->
<div class="cmp-area" id="cmp-area">

  <!-- Panel 1 -->
  <div class="cmp-panel p1" id="panel-1">
    <div class="panel-top">
      <span class="pnum">1</span>
      <span class="pname" id="p1-name">Scroll strip ① below</span>
    </div>
    <div class="panel-imgs" id="p1-imgs">
      <div class="panel-ph" id="p1-ph">
        <div class="arr">↓</div>Use strip ① to pick a mod
      </div>
    </div>
    <div class="race-tabs" id="p1-races"></div>
  </div>

  <!-- Panel 2 -->
  <div class="cmp-panel p2" id="panel-2">
    <div class="panel-top">
      <span class="pnum">2</span>
      <span class="pname" id="p2-name">Scroll strip ② below</span>
    </div>
    <div class="panel-imgs" id="p2-imgs">
      <div class="panel-ph" id="p2-ph">
        <div class="arr">↓</div>Use strip ② to pick a mod
      </div>
    </div>
    <div class="race-tabs" id="p2-races"></div>
  </div>

  <!-- Slider handle + labels -->
  <div class="slider-handle" id="slider-handle"></div>
  <div class="slider-label-1" id="sl-lab-1"></div>
  <div class="slider-label-2" id="sl-lab-2"></div>

</div>

<!-- Strips -->
<div class="strips-area">
  <div class="strip-row r1 kbd-active" id="row-1">
    <div class="strip-gutter">①</div>
    <div class="strip" id="strip-1"></div>
  </div>
  <div class="strip-row r2" id="row-2">
    <div class="strip-gutter">②</div>
    <div class="strip" id="strip-2"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox()">&#x2715; Close</button>
  <img id="lb-img" src="" alt="">
</div>

const RACES = ['Breton','Dark Elf','High Elf','Imperial','Nord','Orc','Redguard','Wood Elf'];

// State

let syncOn = false;
let favOnly = false;
let query = '';

let panelRace = ['Nord','Nord'];  // per-panel race

let sliderPct = 50;
let isDragging = false;

function enc(p) { return p.split('/').map(function(s) { return encodeURIComponent(s); }).join('/'); }
function getImg(mod, t, r) { return (mod.images[t] && mod.images[t][r]) || null; }
function visibleMods() { return MODS.filter(function(m,i) { return !isThumHidden(i); }); }
function isThumHidden(i) {
  const m = MODS[i];
  if (query && !m.mod.toLowerCase().includes(query)) return true;
  if (favOnly && !favorites.has(i)) return true;
  return false;
}

// ── Build race tabs ──────────────────────────────────
function buildRaceTabs(panelId, slot) {
  const cont = document.getElementById('p' + (slot+1) + '-races');
  cont.innerHTML = '';
  RACES.forEach(function(r) {
    const b = document.createElement('button');
    b.className = 'race-tab' + (r === panelRace[slot] ? ' on' : '');
    b.textContent = r;
    b.onclick = function(e) {
      e.stopPropagation();
      panelRace[slot] = r;
      cont.querySelectorAll('.race-tab').forEach(function(x) { x.classList.remove('on'); });
      b.classList.add('on');
      renderPanel(slot);
      if (viewMode === 'slider') updateSliderClip();
    };
    cont.appendChild(b);
  });
}

// ── Render a compare panel ───────────────────────────
function renderPanel(slot) {
  const n = slot + 1;
  const phEl = document.getElementById('p' + n + '-ph');
  const imgsEl = document.getElementById('p' + n + '-imgs');
  const nameEl = document.getElementById('p' + n + '-name');

  // Clear old images
  imgsEl.querySelectorAll('img').forEach(function(el) { el.remove(); });

  if (sel[slot] === null) {
    phEl.style.display = 'flex';
    nameEl.textContent = 'Scroll strip ' + (slot + 1) + ' below';
    return;
  }
  phEl.style.display = 'none';
  const mod = MODS[sel[slot]];
  nameEl.textContent = mod.mod;

  const types = selType === 'BOTH' ? ['BODY','HEAD'] : [selType];
  imgsEl.className = 'panel-imgs' + (selType === 'BOTH' ? ' stacked' : '');

  types.forEach(function(t) {
    const path = getImg(mod, t, panelRace[slot]);
    const img = document.createElement('img');
    img.src = path ? enc(path) : '';
    img.alt = mod.mod + ' ' + t;
    img.onclick = function() { openLightbox(img.src); };
    img.style.cursor = 'zoom-in';
    if (!path) img.style.display = 'none';
    imgsEl.appendChild(img);
  });

  // Slider labels
  if (viewMode === 'slider') {
    document.getElementById('sl-lab-1').textContent = MODS[sel[0]] ? MODS[sel[0]].mod : '';
    document.getElementById('sl-lab-2').textContent = MODS[sel[1]] ? MODS[sel[1]].mod : '';
    updateSliderClip();
  }
}

// ── Compare mode ─────────────────────────────────────
function setMode(mode) {
  viewMode = mode;
  const area = document.getElementById('cmp-area');
  area.classList.toggle('slider', mode === 'slider');
  document.getElementById('btn-side').classList.toggle('on', mode === 'side');
  document.getElementById('btn-slider').classList.toggle('on', mode === 'slider');
  document.getElementById('p1-races').style.display = '';
  document.getElementById('p2-races').style.display = '';
  if (mode === 'slider') {
    updateSliderClip();
    document.getElementById('p2-races').style.display = 'none';
    panelRace[1] = panelRace[0];
    buildRaceTabs('p2-races', 1);
  }
  renderPanel(0); renderPanel(1);
}

// ── Slider drag ──────────────────────────────────────
function updateSliderClip() {
  const p2 = document.getElementById('panel-2');
  const handle = document.getElementById('slider-handle');
  p2.style.clipPath = 'inset(0 0 0 ' + sliderPct + '%)';
  handle.style.left = sliderPct + '%';
  // Sync race for slider
  if (viewMode === 'slider') panelRace[1] = panelRace[0];
}

const handle = document.getElementById('slider-handle');
handle.addEventListener('mousedown', function(e) { isDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  const area = document.getElementById('cmp-area');
  const rect = area.getBoundingClientRect();
  sliderPct = Math.max(2, Math.min(98, (e.clientX - rect.left) / rect.width * 100));
  updateSliderClip();
});
document.addEventListener('mouseup', function() { isDragging = false; });
// Touch support for slider
handle.addEventListener('touchstart', function(e) { isDragging = true; e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', function(e) {
  if (!isDragging) return;
  const area = document.getElementById('cmp-area');
  const rect = area.getBoundingClientRect();
  sliderPct = Math.max(2, Math.min(98, (e.touches[0].clientX - rect.left) / rect.width * 100));
  updateSliderClip();
}, {passive:false});
document.addEventListener('touchend', function() { isDragging = false; });

// ── Strip selection ──────────────────────────────────
function pickMod(slot, i) {
  sel[slot] = (sel[slot] === i) ? null : i;
  kbdCur[slot] = i;
  renderSel();
  renderPanel(slot);
  // scroll selected thumb into view
  const strip = document.getElementById('strip-' + (slot+1));
  const thumbs = strip.querySelectorAll('.thumb:not(.hidden)');
  const visibleIdx = Array.from(MODS).reduce(function(acc,m,mi) {
    if (!isThumHidden(mi)) acc.push(mi); return acc;
  }, []).indexOf(i);
  if (thumbs[visibleIdx]) thumbs[visibleIdx].scrollIntoView({inline:'nearest', behavior:'smooth'});
}

function renderSel() {
  ['strip-1','strip-2'].forEach(function(id, slot) {
    document.querySelectorAll('#' + id + ' .thumb').forEach(function(th, i) {
      th.classList.toggle('sel', sel[slot] === i);
    });
  });
}

// ── Refresh thumbnails ───────────────────────────────
function refresh() {
  ['strip-1','strip-2'].forEach(function(id) {
    let vis = 0;
    document.querySelectorAll('#' + id + ' .thumb').forEach(function(th, i) {
      const hidden = isThumHidden(i);
      th.classList.toggle('hidden', hidden);
      if (!hidden) vis++;
      const img = th.querySelector('img');
      const noimg = th.querySelector('.noimg');
      const path = getImg(MODS[i], selType === 'BOTH' ? 'BODY' : selType, panelRace[0]);
      if (path) { img.src = enc(path); img.style.display = 'block'; noimg.style.display = 'none'; }
      else { img.src = ''; img.style.display = 'none'; noimg.style.display = 'flex'; }
    });
    if (id === 'strip-1') document.getElementById('count').textContent = vis + '\u202f/\u202f' + MODS.length;
  });
  renderPanel(0); renderPanel(1);
}

function onSearch(v) { query = v.toLowerCase(); refresh(); }

// ── Type buttons ─────────────────────────────────────
document.querySelectorAll('[data-type]').forEach(function(b) {
  b.onclick = function() {
    selType = b.dataset.type;
    document.querySelectorAll('[data-type]').forEach(function(x) { x.classList.remove('on'); });
    b.classList.add('on');
    refresh();
  };
});

// ── Sync strips ──────────────────────────────────────
function toggleSync() {
  syncOn = !syncOn;
  document.getElementById('btn-sync').classList.toggle('sync-on', syncOn);
}
const strip1 = document.getElementById('strip-1');
const strip2 = document.getElementById('strip-2');
strip1.addEventListener('scroll', function() { if (syncOn) strip2.scrollLeft = strip1.scrollLeft; });
strip2.addEventListener('scroll', function() { if (syncOn) strip1.scrollLeft = strip2.scrollLeft; });

// ── Favorites ────────────────────────────────────────
function toggleFav(i, e) {
  e.stopPropagation();
  if (favorites.has(i)) favorites.delete(i); else favorites.add(i);
  localStorage.setItem('skinfav', JSON.stringify([...favorites]));
  document.querySelectorAll('.thumb[data-idx="' + i + '"] .star-btn').forEach(function(b) {
    b.classList.toggle('on', favorites.has(i));
    b.textContent = favorites.has(i) ? '\u2605' : '\u2606';
  });
  if (favOnly) refresh();
}
function toggleFavFilter() {
  favOnly = !favOnly;
  document.getElementById('btn-fav').classList.toggle('fav-on', favOnly);
  refresh();
}

// ── Lightbox ─────────────────────────────────────────
function openLightbox(src) {
  if (!src) return;
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-img').style.transform = 'scale(1)';
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lb-close')) return;
  document.getElementById('lightbox').classList.remove('on');
}
// Scroll to zoom in lightbox
let lbScale = 1;
document.getElementById('lb-img').addEventListener('wheel', function(e) {
  e.preventDefault();
  lbScale = Math.max(0.5, Math.min(4, lbScale - e.deltaY * 0.002));
  this.style.transform = 'scale(' + lbScale + ')';
}, {passive:false});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeLightbox({target: document.getElementById('lightbox')}); }
});

// ── Keyboard navigation ──────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (document.getElementById('lightbox').classList.contains('on')) return;

  if (e.key === 'Tab') {
    e.preventDefault();
    kbdSlot = kbdSlot === 0 ? 1 : 0;
    document.getElementById('row-1').classList.toggle('kbd-active', kbdSlot===0);
    document.getElementById('row-2').classList.toggle('kbd-active', kbdSlot===1);
    updateKbdCursor();
    return;
  }

  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    // find visible mods
    const visible = MODS.map(function(m,i) { return i; }).filter(function(i) { return !isThumHidden(i); });
    if (!visible.length) return;
    const curIdx = visible.indexOf(kbdCur[kbdSlot]);
    const nextIdx = Math.max(0, Math.min(visible.length-1, (curIdx === -1 ? 0 : curIdx) + dir));
    kbdCur[kbdSlot] = visible[nextIdx];
    updateKbdCursor();
    return;
  }

  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (kbdCur[kbdSlot] !== null) pickMod(kbdSlot, kbdCur[kbdSlot]);
    return;
  }
});

function updateKbdCursor() {
  ['strip-1','strip-2'].forEach(function(id, slot) {
    document.querySelectorAll('#' + id + ' .thumb').forEach(function(th, i) {
      th.classList.toggle('kbd-cur', kbdSlot === slot && kbdCur[slot] === i);
    });
  });
  // scroll cursor into view
  const stripId = 'strip-' + (kbdSlot+1);
  const strip = document.getElementById(stripId);
  const thumbs = strip.querySelectorAll('.thumb:not(.hidden)');
  const visible = MODS.map(function(m,i){return i;}).filter(function(i){return !isThumHidden(i);});
  const pos = visible.indexOf(kbdCur[kbdSlot]);
  if (thumbs[pos]) thumbs[pos].scrollIntoView({inline:'nearest', behavior:'smooth'});
}

// ── Build strips ─────────────────────────────────────
function buildStrip(id, slot) {
  const strip = document.getElementById(id);
  MODS.forEach(function(mod, i) {
    const path = getImg(mod, selType === 'BOTH' ? 'BODY' : selType, panelRace[slot]);
    const th = document.createElement('div');
    th.className = 'thumb';
    th.dataset.idx = i;
    const isFav = favorites.has(i);
    th.innerHTML =
      '<img src="' + (path ? enc(path) : '') + '" alt="' + mod.mod + '" style="display:' + (path?'block':'none') + '">' +
      '<div class="noimg" style="display:' + (path?'none':'flex') + '">?</div>' +
      '<div class="thumb-bot">' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + mod.mod + '</span>' +
        '<button class="star-btn' + (isFav?' on':'') + '" title="Star" onclick="toggleFav(' + i + ',event)">' + (isFav?'\u2605':'\u2606') + '</button>' +
      '</div>';
    th.addEventListener('click', function() { pickMod(slot, i); });
    strip.appendChild(th);
  });
}

// ── Random pick ──────────────────────────────────────
function randomPick() {
  const visible = MODS.map(function(m,i){return i;}).filter(function(i){return !isThumHidden(i);});
  if (visible.length < 2) return;
  const a = visible[Math.floor(Math.random() * visible.length)];
  let b = a;
  while (b === a) b = visible[Math.floor(Math.random() * visible.length)];
  sel[0] = a; sel[1] = b;
  kbdCur[0] = a; kbdCur[1] = b;
  renderSel();
  renderPanel(0);
  renderPanel(1);
}

// ── Init ─────────────────────────────────────────────
buildRaceTabs('p1-races', 0);
buildRaceTabs('p2-races', 1);
buildStrip('strip-1', 0);
buildStrip('strip-2', 1);
document.getElementById('count').textContent = MODS.length + '\u202f/\u202f' + MODS.length;
kbdCur = [0, 0];
updateKbdCursor();
</script>
